<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="auto" style="background:#090D16;border-radius:16px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.5);">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="460" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="100" r="180" fill="#3B82F6" opacity="0.15" filter="url(#blurFilter)" />
  <circle cx="950" cy="350" r="220" fill="#10B981" opacity="0.12" filter="url(#blurFilter)" />
  <circle cx="600" cy="230" r="150" fill="#6366F1" opacity="0.1" filter="url(#blurFilter)" />

  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="160" y1="0" x2="160" y2="460" />
    <line x1="320" y1="0" x2="320" y2="460" />
    <line x1="480" y1="0" x2="480" y2="460" />
    <line x1="640" y1="0" x2="640" y2="460" />
    <line x1="800" y1="0" x2="800" y2="460" />
    <line x1="960" y1="0" x2="960" y2="460" />
    <line x1="1120" y1="0" x2="1120" y2="460" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#10B981" />
    <text x="32" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ANDROID 8.0+ / API 36</text>

    <!-- Title -->
    <text x="0" y="90" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
      Qobley<tspan fill="#3B82F6">.</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="130" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
      Every code. One place.
    </text>

    <text x="0" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      The ultra-responsive, zero-friction Android Barcode &amp; QR system.
    </text>
    <text x="0" y="194" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      5 Native Widgets • Quick Settings Tiles • Sub-ms Camera • 100% Offline
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="115" height="36" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="14" y="23" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Sub-ms Scan</text>

      <rect x="125" y="0" width="135" height="36" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="139" y="23" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🧩 5 Live Widgets</text>

      <rect x="270" y="0" width="135" height="36" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="284" y="23" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛡️ Zero Telemetry</text>
    </g>

    <!-- Download Badge / CTA Button in Banner -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="230" height="46" rx="12" fill="#2563EB" />
      <!-- Android Icon -->
      <path d="M 22 17 L 25 12 M 34 12 L 31 17 M 21 21 C 21 17 35 17 35 21 Z M 24 19 A 1 1 0 1 1 24 19.01 M 32 19 A 1 1 0 1 1 32 19.01" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <text x="48" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Download APK (22 MB)</text>

      <rect x="245" y="0" width="155" height="46" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="270" y="28" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">★ Star on GitHub</text>
    </g>
  </g>

  <!-- Right Visual Mockups Preview -->
  <g transform="translate(730, 45)" filter="url(#shadowFilter)">
    <!-- Device Frame Silhouette -->
    <rect x="0" y="0" width="390" height="370" rx="28" fill="#0F172A" stroke="#334155" stroke-width="2" />

    <!-- Top Status Bar Area -->
    <rect x="15" y="15" width="360" height="24" rx="6" fill="#1E293B" opacity="0.6"/>
    <text x="28" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Qobley Quick Access Engine</text>
    <circle cx="350" cy="27" r="4" fill="#10B981" />
    <circle cx="335" cy="27" r="4" fill="#3B82F6" />

    <!-- Widget Card 1: Command Center preview inside mockup -->
    <rect x="20" y="52" width="350" height="155" rx="18" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="36" y="78" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Qobley Command Center</text>
    <rect x="290" y="65" width="65" height="20" rx="10" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="298" y="79" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">WIDGET</text>

    <!-- Scan Bar Inside Widget -->
    <rect x="36" y="92" width="318" height="38" rx="10" fill="#2563EB"/>
    <text x="140" y="116" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📷 SCAN ANY CODE</text>

    <!-- Action Buttons Row Inside Widget -->
    <g transform="translate(36, 140)">
      <rect x="0" y="0" width="70" height="28" rx="7" fill="#334155"/>
      <text x="16" y="19" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">QR Code</text>

      <rect x="78" y="0" width="75" height="28" rx="7" fill="#334155"/>
      <text x="89" y="19" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Barcode</text>

      <rect x="161" y="0" width="70" height="28" rx="7" fill="#334155"/>
      <text x="176" y="19" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Wi-Fi</text>

      <rect x="239" y="0" width="79" height="28" rx="7" fill="#334155"/>
      <text x="252" y="19" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Payment</text>
    </g>

    <!-- Widget Card 2 & 3: Small and Single QR previews -->
    <g transform="translate(20, 220)">
      <!-- 1x1 Quick Scan -->
      <rect x="0" y="0" width="168" height="135" rx="18" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <circle cx="84" cy="48" r="26" fill="#2563EB" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="84" cy="48" r="14" fill="#3B82F6"/>
      <text x="56" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Scan Now</text>
      <text x="66" y="116" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">1-Tap Direct</text>

      <!-- Live Pinned QR Widget -->
      <rect x="180" y="0" width="170" height="135" rx="18" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
      <!-- QR Pattern Mini Representation -->
      <rect x="195" y="15" width="48" height="48" rx="6" fill="#FFFFFF" />
      <rect x="200" y="20" width="14" height="14" fill="#000000" />
      <rect x="203" y="23" width="8" height="8" fill="#FFFFFF" />
      <rect x="223" y="20" width="14" height="14" fill="#000000" />
      <rect x="226" y="23" width="8" height="8" fill="#FFFFFF" />
      <rect x="200" y="43" width="14" height="14" fill="#000000" />
      <rect x="203" y="46" width="8" height="8" fill="#FFFFFF" />
      <rect x="220" y="40" width="8" height="8" fill="#000000" />
      <rect x="230" y="48" width="8" height="8" fill="#000000" />

      <text x="252" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Home Wi-Fi</text>
      <text x="252" y="48" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">LIVE PIN</text>

      <rect x="192" y="78" width="68" height="26" rx="6" fill="#334155"/>
      <text x="208" y="95" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Show</text>

      <rect x="268" y="78" width="70" height="26" rx="6" fill="#334155"/>
      <text x="284" y="95" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Share</text>
    </g>
  </g>
</svg>
