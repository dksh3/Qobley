<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="960" height="460" rx="16" fill="url(#archBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Qobley Core System Architecture</text>
  <text x="40" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Modular Android System Layer, Fast-path Deep Links &amp; Zero-Trust Offline Persistence</text>

  <!-- Layer 1: Android OS Entrypoints -->
  <g transform="translate(40, 100)">
    <rect width="880" height="80" rx="12" fill="#0B0F19" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="20" y="28" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">1. ANDROID SYSTEM ENTRYPOINTS</text>

    <!-- Entry boxes -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#1E293B"/>
      <text x="75" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">5× Home Widgets</text>

      <rect x="165" y="0" width="150" height="30" rx="6" fill="#1E293B"/>
      <text x="240" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Quick Settings Tiles</text>

      <rect x="330" y="0" width="160" height="30" rx="6" fill="#1E293B"/>
      <text x="410" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Launcher Shortcuts</text>

      <rect x="505" y="0" width="160" height="30" rx="6" fill="#1E293B"/>
      <text x="585" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Android Share Target</text>

      <rect x="680" y="0" width="155" height="30" rx="6" fill="#1E293B"/>
      <text x="757" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">qobley:// Deep Links</text>
    </g>
  </g>

  <!-- Connecting Arrows -->
  <g stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="480" y1="180" x2="480" y2="204"/>
    <polyline points="475 198 480 204 485 198"/>
  </g>

  <!-- Layer 2: Central Router & ViewModel Orchestration -->
  <g transform="translate(40, 208)">
    <rect width="880" height="96" rx="12" fill="#0B0F19" stroke="#10B981" stroke-width="1.2"/>
    <text x="20" y="26" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">2. CENTRAL ROUTER &amp; APP STATE</text>

    <!-- Sub Modules -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="260" height="46" rx="8" fill="#1E293B"/>
      <text x="130" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">QobleyDeepLinkRouter</text>
      <text x="130" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">URI Parsing &amp; Route Dispatching</text>

      <rect x="280" y="0" width="290" height="46" rx="8" fill="#1E293B"/>
      <text x="425" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MainViewModel &amp; StateFlow</text>
      <text x="425" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Coroutines • Navigation • Reactive UI</text>

      <rect x="590" y="0" width="250" height="46" rx="8" fill="#1E293B"/>
      <text x="715" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">QobleyWidgetUpdater</text>
      <text x="715" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">AppWidgetManager Broadcaster</text>
    </g>
  </g>

  <!-- Connecting Arrows -->
  <g stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="480" y1="304" x2="480" y2="328"/>
    <polyline points="475 322 480 328 485 322"/>
  </g>

  <!-- Layer 3: Core Engines & Persistence -->
  <g transform="translate(40, 332)">
    <rect width="880" height="96" rx="12" fill="#0B0F19" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="20" y="26" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">3. HARDWARE ENGINES &amp; DATA REPOSITORY</text>

    <!-- Sub Modules -->
    <g transform="translate(20, 36)">
      <!-- Camera & Decoder -->
      <rect x="0" y="0" width="260" height="46" rx="8" fill="#1E293B"/>
      <text x="130" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CameraX &amp; BarcodeAnalyzer</text>
      <text x="130" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Multi-Format ZXing Decoder (1D/2D)</text>

      <!-- Generator & Validator -->
      <rect x="280" y="0" width="290" height="46" rx="8" fill="#1E293B"/>
      <text x="425" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">BarcodeGenerator &amp; Validator</text>
      <text x="425" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Custom Matrix Bitmaps • Luhn Checksums</text>

      <!-- Room DB -->
      <rect x="590" y="0" width="250" height="46" rx="8" fill="#1E293B"/>
      <text x="715" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AppDatabase (Room 2.6)</text>
      <text x="715" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">CodeDao • SQLite • 100% Offline</text>
    </g>
  </g>
</svg>
