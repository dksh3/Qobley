<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="auto" style="background:#090E17;border-radius:16px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,0.4);">
  <defs>
    <linearGradient id="wBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="wShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="920" height="620" fill="#090E17" />

  <!-- Section Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="20" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">NATIVE ANDROID HOME-SCREEN ECOSYSTEM</text>
    <text x="0" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">5 Purpose-Built Material 3 Widgets</text>
    <text x="0" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Never make users open Qobley first. Instant camera deep links and live home-screen rendering.</text>
  </g>

  <!-- Widgets Grid -->
  <g transform="translate(60, 130)">
    
    <!-- 1. Small 1x1 Quick Scan Widget -->
    <g transform="translate(0, 0)" filter="url(#wShadow)">
      <rect x="0" y="0" width="160" height="180" rx="24" fill="url(#wBgGrad)" stroke="#334155" stroke-width="1.5"/>
      <circle cx="80" cy="65" r="32" fill="#2563EB" fill-opacity="0.2" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="80" cy="65" r="16" fill="#3B82F6"/>
      <path d="M 72 65 L 88 65 M 80 57 L 80 73" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

      <text x="80" y="126" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Scan</text>
      <text x="80" y="146" text-anchor="middle" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">qobley://scan</text>
      <text x="80" y="164" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">1×1 Quick Scan</text>
    </g>

    <!-- 2. Medium Quick Access Widget -->
    <g transform="translate(180, 0)" filter="url(#wShadow)">
      <rect x="0" y="0" width="300" height="180" rx="24" fill="url(#wBgGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Qobley Quick Access</text>
      <text x="276" y="32" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">MEDIUM</text>

      <!-- Primary Scan Button -->
      <rect x="24" y="48" width="252" height="46" rx="14" fill="#2563EB"/>
      <text x="150" y="77" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">📷 Scan Any Code</text>

      <!-- Quick Action Row -->
      <g transform="translate(24, 108)">
        <rect x="0" y="0" width="76" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="38" y="24" text-anchor="middle" fill="#38BDF8" font-size="14">QR</text>
        <text x="38" y="40" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Create</text>

        <rect x="88" y="0" width="76" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="126" y="24" text-anchor="middle" fill="#38BDF8" font-size="14">BAR</text>
        <text x="126" y="40" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Barcode</text>

        <rect x="176" y="0" width="76" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="214" y="24" text-anchor="middle" fill="#38BDF8" font-size="14">🖼️</text>
        <text x="214" y="40" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Image</text>
      </g>
    </g>

    <!-- 3. Single Pinned Code Widget (Live Scannable) -->
    <g transform="translate(500, 0)" filter="url(#wShadow)">
      <rect x="0" y="0" width="300" height="180" rx="24" fill="url(#wBgGrad)" stroke="#10B981" stroke-width="1.8"/>
      
      <!-- Mini QR on Left -->
      <rect x="20" y="24" width="84" height="84" rx="10" fill="#FFFFFF"/>
      <!-- QR Blocks -->
      <rect x="28" y="32" width="24" height="24" rx="2" fill="#000"/>
      <rect x="34" y="38" width="12" height="12" fill="#FFF"/>
      <rect x="37" y="41" width="6" height="6" fill="#000"/>

      <rect x="72" y="32" width="24" height="24" rx="2" fill="#000"/>
      <rect x="78" y="38" width="12" height="12" fill="#FFF"/>
      <rect x="81" y="41" width="6" height="6" fill="#000"/>

      <rect x="28" y="76" width="24" height="24" rx="2" fill="#000"/>
      <rect x="34" y="82" width="12" height="12" fill="#FFF"/>
      <rect x="37" y="85" width="6" height="6" fill="#000"/>

      <rect x="58" y="44" width="8" height="28" fill="#000"/>
      <rect x="72" y="76" width="24" height="10" fill="#000"/>
      <rect x="62" y="82" width="6" height="16" fill="#000"/>

      <!-- Info on Right -->
      <g transform="translate(120, 28)">
        <text x="0" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Home Wi-Fi</text>
        <text x="0" y="34" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">LIVE SCANNABLE</text>
        <text x="0" y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Guests scan phone screen</text>
        <text x="0" y="66" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">No app opening required</text>
      </g>

      <!-- Action Row Below -->
      <g transform="translate(20, 124)">
        <rect x="0" y="0" width="125" height="38" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="62" y="24" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Open in App</text>

        <rect x="135" y="0" width="125" height="38" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="197" y="24" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Share QR</text>
      </g>
    </g>

    <!-- 4. Large Command Center Widget -->
    <g transform="translate(0, 200)" filter="url(#wShadow)">
      <rect x="0" y="0" width="480" height="230" rx="24" fill="url(#wBgGrad)" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="24" y="32" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Qobley Command Center</text>
      <text x="456" y="32" text-anchor="end" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">History →</text>

      <!-- Giant Scan Bar -->
      <rect x="24" y="46" width="432" height="42" rx="12" fill="#2563EB"/>
      <text x="240" y="73" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📷 SCAN ANY CODE INSTANTLY</text>

      <!-- 4 Quick Creators -->
      <g transform="translate(24, 98)">
        <rect x="0" y="0" width="102" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="51" y="20" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">QR Code</text>

        <rect x="110" y="0" width="102" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="161" y="20" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Barcode</text>

        <rect x="220" y="0" width="102" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="271" y="20" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Wi-Fi</text>

        <rect x="330" y="0" width="102" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="381" y="20" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Payment</text>
      </g>

      <!-- Recent Scans Live List -->
      <text x="24" y="152" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">RECENT ITEMS (ROOM DATABASE SYNC)</text>
      
      <g transform="translate(24, 162)">
        <rect x="0" y="0" width="432" height="28" rx="8" fill="#0F172A"/>
        <text x="14" y="19" fill="#60A5FA" font-size="10" font-weight="700">[URL]</text>
        <text x="50" y="19" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Qobley GitHub Repo</text>
        <text x="180" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">https://github.com/qobley/app</text>

        <rect x="0" y="32" width="432" height="28" rx="8" fill="#0F172A"/>
        <text x="14" y="51" fill="#34D399" font-size="10" font-weight="700">[WIFI]</text>
        <text x="54" y="51" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Studio Mesh Network</text>
        <text x="195" y="51" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">WPA2/WPA3 Personal</text>
      </g>
    </g>

    <!-- 5. Favorites Starred Widget -->
    <g transform="translate(500, 200)" filter="url(#wShadow)">
      <rect x="0" y="0" width="300" height="230" rx="24" fill="url(#wBgGrad)" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="24" y="32" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">★ Qobley Favorites</text>
      <text x="276" y="32" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Saved →</text>

      <!-- Favorite Item 1 -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="260" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#F59E0B" fill-opacity="0.2"/>
        <text x="19" y="29" fill="#F59E0B" font-size="14">★</text>
        <text x="46" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Home Wi-Fi</text>
        <text x="46" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">WPA2 Password Protected</text>
        <rect x="208" y="14" width="42" height="20" rx="6" fill="#1E293B"/>
        <text x="216" y="28" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">WIFI</text>
      </g>

      <!-- Favorite Item 2 -->
      <g transform="translate(20, 106)">
        <rect x="0" y="0" width="260" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#F59E0B" fill-opacity="0.2"/>
        <text x="19" y="29" fill="#F59E0B" font-size="14">★</text>
        <text x="46" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Store UPI Pay</text>
        <text x="46" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">merchant@upi</text>
        <rect x="214" y="14" width="36" height="20" rx="6" fill="#1E293B"/>
        <text x="222" y="28" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">PAY</text>
      </g>

      <!-- Favorite Item 3 -->
      <g transform="translate(20, 162)">
        <rect x="0" y="0" width="260" height="48" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#F59E0B" fill-opacity="0.2"/>
        <text x="19" y="29" fill="#F59E0B" font-size="14">★</text>
        <text x="46" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Personal Contact</text>
        <text x="46" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">vCard 3.0 Digital Card</text>
        <rect x="210" y="14" width="40" height="20" rx="6" fill="#1E293B"/>
        <text x="216" y="28" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">CARD</text>
      </g>
    </g>

  </g>
</svg>
