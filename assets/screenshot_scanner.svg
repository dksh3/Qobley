<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 960" width="100%" height="100%">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <filter id="blurScan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Device Frame & Canvas Background -->
  <rect width="480" height="960" rx="36" fill="url(#screenBg)"/>
  <rect x="2" y="2" width="476" height="956" rx="34" fill="none" stroke="#1E293B" stroke-width="3"/>

  <!-- Status Bar (Android) -->
  <text x="32" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">09:41</text>
  <g transform="translate(400, 20)">
    <!-- Battery & Wi-Fi Icons -->
    <path d="M 0 10 A 10 10 0 0 1 14 0 A 10 10 0 0 1 28 10 Z" fill="#94A3B8"/>
    <rect x="36" y="2" width="22" height="11" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="38" y="4" width="14" height="7" rx="1" fill="#10B981"/>
    <rect x="58" y="5" width="2" height="5" rx="1" fill="#94A3B8"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(24, 52)">
    <circle cx="20" cy="20" r="18" fill="#1E293B"/>
    <!-- Back arrow -->
    <path d="M 24 14 L 16 20 L 24 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="56" y="25" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Qobley Scanner</text>
    
    <!-- Flashlight & Gallery Toggles -->
    <circle cx="370" cy="20" r="18" fill="#1E293B"/>
    <path d="M 370 12 L 366 21 L 372 21 L 368 28" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <circle cx="414" cy="20" r="18" fill="#1E293B"/>
    <rect x="406" y="13" width="16" height="14" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
    <circle cx="411" cy="17" r="1.5" fill="#94A3B8"/>
  </g>

  <!-- Camera Viewfinder Area -->
  <g transform="translate(24, 110)">
    <!-- Camera Viewport Box -->
    <rect x="0" y="0" width="432" height="460" rx="20" fill="#050811" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Darkened overlay around scan target -->
    <rect x="0" y="0" width="432" height="460" rx="20" fill="#000000" fill-opacity="0.35"/>

    <!-- Clear Target Cutout -->
    <rect x="66" y="70" width="300" height="300" rx="16" fill="none" stroke="#334155" stroke-dasharray="6 6" stroke-width="1.5"/>

    <!-- Viewfinder Corners (Material Accent Blue) -->
    <path d="M 66 106 L 66 70 L 102 70" fill="none" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 366 106 L 366 70 L 330 70" fill="none" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 66 334 L 66 370 L 102 370" fill="none" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 366 334 L 366 370 L 330 370" fill="none" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Scanned QR Code Inside Box -->
    <g transform="translate(106, 110)">
      <!-- Top Left Finder -->
      <rect x="0" y="0" width="60" height="60" fill="#F8FAFC" rx="8"/>
      <rect x="10" y="10" width="40" height="40" fill="#050811" rx="4"/>
      <rect x="18" y="18" width="24" height="24" fill="#3B82F6" rx="3"/>

      <!-- Top Right Finder -->
      <rect x="160" y="0" width="60" height="60" fill="#F8FAFC" rx="8"/>
      <rect x="170" y="10" width="40" height="40" fill="#050811" rx="4"/>
      <rect x="178" y="18" width="24" height="24" fill="#3B82F6" rx="3"/>

      <!-- Bottom Left Finder -->
      <rect x="0" y="160" width="60" height="60" fill="#F8FAFC" rx="8"/>
      <rect x="10" y="170" width="40" height="40" fill="#050811" rx="4"/>
      <rect x="18" y="178" width="24" height="24" fill="#3B82F6" rx="3"/>

      <!-- Data Matrices -->
      <rect x="76" y="8" width="16" height="16" fill="#E2E8F0" rx="2"/>
      <rect x="108" y="8" width="16" height="16" fill="#E2E8F0" rx="2"/>
      <rect x="136" y="8" width="12" height="12" fill="#60A5FA" rx="2"/>

      <rect x="76" y="38" width="24" height="12" fill="#60A5FA" rx="2"/>
      <rect x="112" y="38" width="16" height="16" fill="#E2E8F0" rx="2"/>

      <rect x="80" y="72" width="20" height="20" fill="#E2E8F0" rx="2"/>
      <rect x="116" y="72" width="24" height="16" fill="#3B82F6" rx="2"/>
      <rect x="156" y="72" width="20" height="20" fill="#E2E8F0" rx="2"/>

      <rect x="76" y="112" width="28" height="16" fill="#E2E8F0" rx="2"/>
      <rect x="116" y="112" width="16" height="20" fill="#60A5FA" rx="2"/>
      <rect x="148" y="112" width="24" height="24" fill="#E2E8F0" rx="2"/>

      <rect x="80" y="160" width="20" height="20" fill="#E2E8F0" rx="2"/>
      <rect x="112" y="160" width="24" height="20" fill="#3B82F6" rx="2"/>
      <rect x="148" y="168" width="20" height="16" fill="#E2E8F0" rx="2"/>
      <rect x="184" y="160" width="20" height="24" fill="#E2E8F0" rx="2"/>
    </g>

    <!-- Glowing Scan Line -->
    <line x1="66" y1="210" x2="366" y2="210" stroke="url(#laserGrad)" stroke-width="4" filter="url(#blurScan)"/>
    <line x1="66" y1="210" x2="366" y2="210" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Real-time HUD Subtitle -->
    <rect x="126" y="405" width="180" height="32" rx="16" fill="#1E293B" fill-opacity="0.85"/>
    <circle cx="144" cy="421" r="4.5" fill="#10B981"/>
    <text x="156" y="426" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Full-Frame Active (60fps)</text>
  </g>

  <!-- Live Detected Code Action Card (Overlay bottom) -->
  <g transform="translate(24, 590)" filter="url(#shadowBox)">
    <!-- Card container -->
    <rect x="0" y="0" width="432" height="240" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <!-- Header / Type Badge -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="90" height="24" rx="6" fill="#2563EB"/>
      <text x="12" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">QR • URL</text>

      <circle cx="360" cy="12" r="14" fill="#334155"/>
      <path d="M 360 6 L 362 10 L 366 11 L 363 14 L 364 18 L 360 16 L 356 18 L 357 14 L 354 11 L 358 10 Z" fill="#FBBF24"/>
    </g>

    <!-- Detected Content Info -->
    <text x="24" y="74" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">github.com/qobley/android</text>
    <text x="24" y="98" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">https://github.com/qobley/android</text>
    <text x="24" y="118" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Decoded in 16ms • Verified HTTPS Security</text>

    <!-- Action Buttons Row -->
    <g transform="translate(24, 138)">
      <!-- Primary Open Button -->
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#3B82F6"/>
      <path d="M 18 21 L 28 21 M 23 16 L 28 21 L 23 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="36" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Open Browser</text>

      <!-- Secondary Copy Button -->
      <rect x="192" y="0" width="90" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="216" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Copy</text>

      <!-- Share Button -->
      <rect x="292" y="0" width="90" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="314" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Share</text>
    </g>

    <!-- Save Confirmation / History notice -->
    <text x="24" y="210" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">✓ Auto-saved to History • Stored on-device</text>
  </g>

  <!-- Bottom Navigation Bar (Material 3) -->
  <g transform="translate(0, 864)">
    <rect width="480" height="96" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>

    <!-- Scanner Tab (Active) -->
    <g transform="translate(60, 16)">
      <rect x="0" y="0" width="64" height="32" rx="16" fill="#1E3A8A"/>
      <circle cx="32" cy="16" r="8" fill="none" stroke="#60A5FA" stroke-width="2"/>
      <text x="32" y="48" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Scan</text>
    </g>

    <!-- Create Tab -->
    <g transform="translate(170, 16)">
      <path d="M 32 10 L 32 26 M 24 18 L 40 18" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Create</text>
    </g>

    <!-- History Tab -->
    <g transform="translate(280, 16)">
      <circle cx="32" cy="18" r="8" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <polyline points="32 14 32 18 36 20" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      <text x="32" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">History</text>
    </g>

    <!-- Saved Library Tab -->
    <g transform="translate(390, 16)">
      <path d="M 26 12 L 38 12 L 38 26 L 32 22 L 26 26 Z" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <text x="32" y="48" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Saved</text>
    </g>
  </g>
</svg>
