<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="auto" style="background:#080C14;border-radius:16px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,0.4);">
  <defs>
    <linearGradient id="crBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="800" height="700" fill="#090D16" />

  <!-- Section Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" fill="#6366F1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">HIGH-PRECISION CODE SYNTHESIS</text>
    <text x="0" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Universal Creator Studio</text>
    <text x="0" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Real-time vector synthesis, custom palettes, error correction controls, and verified scannability.</text>
  </g>

  <!-- Phone Mockup Container Centered -->
  <g transform="translate(240, 120)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="320" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>

    <!-- Screen Bezel/Camera Notch -->
    <circle cx="160" cy="18" r="4.5" fill="#1E293B" />

    <!-- App Screen Background -->
    <rect x="8" y="32" width="304" height="496" rx="28" fill="url(#crBgGrad)"/>

    <!-- Top App Bar in Creator -->
    <g transform="translate(24, 48)">
      <text x="0" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">QR Creator</text>
      <rect x="220" y="0" width="50" height="26" rx="6" fill="#2563EB"/>
      <text x="232" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Save</text>
    </g>

    <!-- Code Type Selector Chips -->
    <g transform="translate(20, 84)">
      <rect x="0" y="0" width="54" height="28" rx="8" fill="#2563EB"/>
      <text x="12" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Wi-Fi</text>

      <rect x="60" y="0" width="50" height="28" rx="8" fill="#1E293B"/>
      <text x="74" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">URL</text>

      <rect x="116" y="0" width="60" height="28" rx="8" fill="#1E293B"/>
      <text x="126" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Contact</text>

      <rect x="182" y="0" width="58" height="28" rx="8" fill="#1E293B"/>
      <text x="194" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pay UPI</text>

      <rect x="246" y="0" width="34" height="28" rx="8" fill="#1E293B"/>
      <text x="254" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">···</text>
    </g>

    <!-- Interactive Live QR Code Card Preview -->
    <g transform="translate(62, 126)">
      <rect x="0" y="0" width="196" height="196" rx="20" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
      
      <!-- High Detail QR Vector Representation -->
      <g transform="translate(18, 18)">
        <!-- Top Left Eye -->
        <rect x="0" y="0" width="46" height="46" rx="6" fill="#0B132B"/>
        <rect x="10" y="10" width="26" height="26" rx="3" fill="#FFFFFF"/>
        <rect x="16" y="16" width="14" height="14" rx="2" fill="#0B132B"/>

        <!-- Top Right Eye -->
        <rect x="114" y="0" width="46" height="46" rx="6" fill="#0B132B"/>
        <rect x="124" y="10" width="26" height="26" rx="3" fill="#FFFFFF"/>
        <rect x="130" y="16" width="14" height="14" rx="2" fill="#0B132B"/>

        <!-- Bottom Left Eye -->
        <rect x="0" y="114" width="46" height="46" rx="6" fill="#0B132B"/>
        <rect x="10" y="124" width="26" height="26" rx="3" fill="#FFFFFF"/>
        <rect x="16" y="130" width="14" height="14" rx="2" fill="#0B132B"/>

        <!-- Data Grid Modules -->
        <rect x="56" y="0" width="10" height="20" fill="#0B132B"/>
        <rect x="74" y="10" width="20" height="10" fill="#0B132B"/>
        <rect x="56" y="36" width="30" height="10" fill="#0B132B"/>
        <rect x="0" y="56" width="20" height="10" fill="#0B132B"/>
        <rect x="36" y="56" width="10" height="40" fill="#0B132B"/>
        <rect x="56" y="56" width="48" height="48" fill="#0B132B"/>
        <rect x="114" y="56" width="10" height="20" fill="#0B132B"/>
        <rect x="134" y="66" width="26" height="10" fill="#0B132B"/>
        <rect x="114" y="86" width="46" height="10" fill="#0B132B"/>
        <rect x="56" y="114" width="20" height="20" fill="#0B132B"/>
        <rect x="86" y="114" width="20" height="46" fill="#0B132B"/>
        <rect x="114" y="114" width="46" height="20" fill="#0B132B"/>
        <rect x="134" y="140" width="26" height="20" fill="#0B132B"/>

        <!-- Center Brand Emblem -->
        <circle cx="80" cy="80" r="16" fill="#FFFFFF"/>
        <circle cx="80" cy="80" r="13" fill="#2563EB"/>
        <text x="74" y="85" fill="#FFFFFF" font-size="12">📶</text>
      </g>
    </g>

    <!-- Creator Configuration Controls Below -->
    <g transform="translate(20, 334)">
      <!-- Input fields preview -->
      <rect x="0" y="0" width="280" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">SSID: Home_Guest_5G</text>

      <rect x="0" y="46" width="280" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Security: WPA/WPA2/WPA3</text>

      <!-- Palette Chips -->
      <g transform="translate(0, 94)">
        <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Style Palette:</text>
        <circle cx="95" cy="10" r="9" fill="#000000" stroke="#38BDF8" stroke-width="2"/>
        <circle cx="125" cy="10" r="9" fill="#1E3A8A"/>
        <circle cx="155" cy="10" r="9" fill="#065F46"/>
        <circle cx="185" cy="10" r="9" fill="#7C2D12"/>
        <circle cx="215" cy="10" r="9" fill="#4C1D95"/>
      </g>

      <!-- Action Row -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="134" height="36" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="36" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🖨️ Print Card</text>

        <rect x="144" y="0" width="136" height="36" rx="10" fill="#2563EB"/>
        <text x="178" y="23" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">📤 Export PNG</text>
      </g>
    </g>

  </g>
</svg>
