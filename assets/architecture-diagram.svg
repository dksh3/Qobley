<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" style="background:#090D16;border-radius:16px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,0.4);">
  <defs>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="#090D16" />

  <!-- Section Header -->
  <g transform="translate(60, 36)">
    <text x="0" y="20" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">REACTIVE &amp; MODULAR ARCHITECTURE</text>
    <text x="0" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Qobley Clean System Architecture</text>
    <text x="0" y="76" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Strict MVVM, unidirectional data flow, 100% on-device processing, and multi-surface entry points.</text>
  </g>

  <!-- Diagram Layers Container -->
  <g transform="translate(60, 125)">
    <!-- 1. Entry Points / System Surfaces Layer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="840" height="66" rx="14" fill="url(#layerGrad)" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="14" y="16" width="160" height="34" rx="8" fill="#0284C7" fill-opacity="0.2"/>
      <text x="24" y="38" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. SYSTEM SURFACES</text>

      <g transform="translate(190, 16)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📱 5 AppWidgets</text>

        <rect x="155" y="0" width="140" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ 2 Quick Settings</text>

        <rect x="305" y="0" width="145" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎯 App Shortcuts</text>

        <rect x="460" y="0" width="180" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🛡️ Android Share Target</text>
      </g>
    </g>

    <!-- Connector 1 -->
    <path d="M 420 66 L 420 84" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- 2. Centralized Router & Intent Dispatcher -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="840" height="54" rx="14" fill="url(#layerGrad)" stroke="#818CF8" stroke-width="1.5"/>
      <rect x="14" y="10" width="160" height="34" rx="8" fill="#4F46E5" fill-opacity="0.2"/>
      <text x="24" y="32" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. ROUTING LAYER</text>

      <text x="200" y="33" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">QobleyDeepLinkRouter · Resolves <tspan fill="#38BDF8">qobley://*</tspan> &amp; <tspan fill="#38BDF8">https://qobley.example/*</tspan> Directly</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 420 138 L 420 156" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- 3. UI Presentation Layer (Jetpack Compose & ViewModels) -->
    <g transform="translate(0, 156)">
      <rect x="0" y="0" width="840" height="66" rx="14" fill="url(#layerGrad)" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="14" y="16" width="160" height="34" rx="8" fill="#2563EB" fill-opacity="0.2"/>
      <text x="24" y="38" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">3. PRESENTATION</text>

      <g transform="translate(190, 16)">
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Camera Scanner</text>

        <rect x="160" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Creator Studio</text>

        <rect x="320" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Library &amp; History</text>

        <rect x="480" y="0" width="160" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MainViewModel / State</text>
      </g>
    </g>

    <!-- Connector 3 -->
    <path d="M 420 222 L 420 240" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- 4. Domain & Engine Processing Layer -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="840" height="66" rx="14" fill="url(#layerGrad)" stroke="#34D399" stroke-width="1.5"/>
      <rect x="14" y="16" width="160" height="34" rx="8" fill="#059669" fill-opacity="0.2"/>
      <text x="24" y="38" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">4. ENGINES &amp; DOMAIN</text>

      <g transform="translate(190, 16)">
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ZXing MultiFormat</text>

        <rect x="160" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PayloadParser (12+)</text>

        <rect x="320" y="0" width="150" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">BarcodeGenerator</text>

        <rect x="480" y="0" width="160" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CheckDigit Validators</text>
      </g>
    </g>

    <!-- Connector 4 -->
    <path d="M 420 306 L 420 324" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- 5. Persistence & Local Database Layer -->
    <g transform="translate(0, 324)">
      <rect x="0" y="0" width="840" height="54" rx="14" fill="url(#layerGrad)" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="14" y="10" width="160" height="34" rx="8" fill="#D97706" fill-opacity="0.2"/>
      <text x="24" y="32" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">5. LOCAL PERSISTENCE</text>

      <text x="200" y="33" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Android Room SQLite · Zero Cloud · Full Encryption &amp; Synchronous Widget Queries</text>
    </g>
  </g>
</svg>
