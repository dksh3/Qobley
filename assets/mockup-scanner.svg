<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="auto" style="background:#080C14;border-radius:16px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,0.4);">
  <defs>
    <linearGradient id="scBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="60%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <rect width="800" height="700" fill="#090D16" />

  <!-- Title Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SUB-MILLISECOND CAMERAX ENGINE</text>
    <text x="0" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Universal Scanner Viewfinder</text>
    <text x="0" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Instant detection across 1D/2D codes, batch modes, and document contrast enhancement.</text>
  </g>

  <!-- Phone Mockup Container Centered -->
  <g transform="translate(240, 120)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="320" height="540" rx="36" fill="#020617" stroke="#334155" stroke-width="4"/>

    <!-- Screen Bezel/Camera Notch -->
    <circle cx="160" cy="18" r="4.5" fill="#1E293B" />

    <!-- Camera Feed Mockup Background -->
    <rect x="8" y="32" width="304" height="496" rx="28" fill="url(#scBgGrad)"/>

    <!-- Subtle Simulated Camera Grid/Lines -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
      <line x1="8" y1="190" x2="312" y2="190" />
      <line x1="8" y1="350" x2="312" y2="350" />
      <line x1="108" y1="32" x2="108" y2="528" />
      <line x1="212" y1="32" x2="212" y2="528" />
    </g>

    <!-- Scanner Target Reticle Box -->
    <g transform="translate(60, 130)">
      <!-- Corner Reticles -->
      <path d="M 0 30 L 0 0 L 30 0" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 170 0 L 200 0 L 200 30" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 0 170 L 0 200 L 30 200" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 170 200 L 200 200 L 200 170" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- QR Code Matrix Simulation inside Reticle -->
      <g transform="translate(30, 30)" opacity="0.85">
        <rect x="0" y="0" width="140" height="140" rx="8" fill="#FFFFFF"/>
        <!-- QR Eyes -->
        <rect x="12" y="12" width="36" height="36" rx="4" fill="#0F172A"/>
        <rect x="20" y="20" width="20" height="20" fill="#FFFFFF"/>
        <rect x="24" y="24" width="12" height="12" fill="#0F172A"/>

        <rect x="92" y="12" width="36" height="36" rx="4" fill="#0F172A"/>
        <rect x="100" y="20" width="20" height="20" fill="#FFFFFF"/>
        <rect x="104" y="24" width="12" height="12" fill="#0F172A"/>

        <rect x="12" y="92" width="36" height="36" rx="4" fill="#0F172A"/>
        <rect x="20" y="100" width="20" height="20" fill="#FFFFFF"/>
        <rect x="24" y="104" width="12" height="12" fill="#0F172A"/>

        <!-- Random data modules -->
        <rect x="56" y="20" width="8" height="24" fill="#0F172A"/>
        <rect x="72" y="12" width="12" height="8" fill="#0F172A"/>
        <rect x="56" y="56" width="28" height="28" fill="#0F172A"/>
        <rect x="92" y="56" width="36" height="12" fill="#0F172A"/>
        <rect x="64" y="92" width="20" height="36" fill="#0F172A"/>
        <rect x="92" y="76" width="36" height="20" fill="#0F172A"/>
        <rect x="96" y="104" width="16" height="24" fill="#0F172A"/>
      </g>

      <!-- Laser Scanner Beam -->
      <line x1="10" y1="100" x2="190" y2="100" stroke="url(#laserGrad)" stroke-width="3" filter="url(#scanGlow)"/>
      <line x1="10" y1="100" x2="190" y2="100" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Top Overlay Controls: Flashlight, Camera Flip, Settings -->
    <g transform="translate(24, 48)">
      <circle cx="20" cy="20" r="18" fill="#0F172A" fill-opacity="0.7"/>
      <text x="14" y="26" fill="#F8FAFC" font-size="14">⚡</text>

      <rect x="80" y="4" width="108" height="32" rx="16" fill="#0F172A" fill-opacity="0.8"/>
      <text x="96" y="25" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">QR DETECTED</text>

      <circle cx="248" cy="20" r="18" fill="#0F172A" fill-opacity="0.7"/>
      <text x="240" y="26" fill="#F8FAFC" font-size="14">🖼️</text>
    </g>

    <!-- Scanned Result Bottom Sheet Modal -->
    <g transform="translate(18, 360)">
      <rect x="0" y="0" width="284" height="152" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <!-- Drag handle -->
      <rect x="122" y="8" width="40" height="4" rx="2" fill="#64748B" />

      <!-- Payload Icon & Title -->
      <rect x="16" y="22" width="34" height="34" rx="8" fill="#2563EB" fill-opacity="0.2"/>
      <text x="24" y="44" fill="#60A5FA" font-size="16">🌐</text>

      <text x="60" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">https://github.com/qobley</text>
      <text x="60" y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">QR CODE · Web URL · SSL Verified</text>

      <!-- Action Buttons Row -->
      <g transform="translate(14, 72)">
        <rect x="0" y="0" width="76" height="32" rx="8" fill="#2563EB"/>
        <text x="14" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Open URL</text>

        <rect x="84" y="0" width="60" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="96" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Copy</text>

        <rect x="152" y="0" width="58" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="164" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Share</text>

        <rect x="218" y="0" width="38" height="32" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
        <text x="229" y="21" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">★</text>
      </g>

      <!-- Secondary Info -->
      <text x="16" y="130" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Saved to local History • Zero cloud upload</text>
    </g>
  </g>
</svg>
